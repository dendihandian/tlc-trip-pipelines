services:
  db:
    build: ./services/db
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./services/db/.volume:/var/lib/postgresql
    networks:
      tlc_trip_pipelines:
        aliases:
          - postgres
          - db

  db-ui:
    build: ./services/db-ui
    container_name: db-ui
    restart: always
    environment:
      - PGWEB_DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}?sslmode=disable
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DATABASE}?sslmode=disable
    ports:
      - "${DB_UI_PORT:-${PGWEB_PORT:-8081}}:8081"
    depends_on:
      - db
    networks:
      - tlc_trip_pipelines

  pipelines:
    build: ./services/pipelines
    container_name: pipelines
    restart: always
    environment:
      - POSTGRES_HOST=db # use the db service name in this yml
      - DB_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
    depends_on:
      - db
    volumes:
      - ./services/pipelines/app:/app
    networks:
      - tlc_trip_pipelines

networks:
  tlc_trip_pipelines:
    driver: bridge
